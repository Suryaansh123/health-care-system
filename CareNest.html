<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareNest - Patient Health Dashboard</title>
<style>
:root{--ink:#12302f;--paper:#eef6f5;--main:#0b7a75;--soft:#d9efec;--red:#d94f4f;--mute:#5f7b79;--line:#d3e4e2;--amber:#e39b1b}
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",sans-serif;background:var(--paper);color:var(--ink);display:flex;min-height:100vh}
aside{width:210px;background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:22px;margin-bottom:24px}aside h1 span{color:#5fd6cd}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#b8d3d0;padding:11px;border-radius:8px;font-size:15px;cursor:pointer;margin-bottom:3px}
aside button.on,aside button:hover{background:#1f4a48;color:#fff}
main{flex:1;padding:26px;max-width:1100px;min-width:0}
h2{font-size:26px;margin-bottom:6px}.sub{color:var(--mute);margin-bottom:18px;font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
label{font-size:13px;color:var(--mute);display:block;margin:0 0 4px}.fld{display:flex;flex-direction:column}
.chip{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font-size:14px}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}.chip.dis{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card,.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}
.card{padding:16px}.card .av{width:52px;height:52px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
.card h3{font-size:17px}.card p{color:var(--mute);font-size:14px;margin:3px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--main);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:15px;cursor:pointer}
.btn:disabled{background:#b5c9c7;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.red{background:var(--red)}.btn.sm{padding:6px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:18px}.stat span{color:var(--mute);font-size:14px}.stat b{display:block;font-size:26px;margin-top:6px}
.panel{padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;color:#fff;background:var(--main)}
.tag.Cancelled,.tag.High,.tag.Low{background:var(--red)}.tag.Normal{background:var(--main)}.tag.Watch{background:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer}
.tile span{display:block;font-size:30px}.tile:hover{border-color:var(--main)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.sos{background:var(--red);color:#fff;border-radius:14px;padding:18px;margin-bottom:16px}
.sos a{color:#fff;font-weight:bold;font-size:20px;text-decoration:none}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.help div{background:#fff1f1;border-radius:10px;padding:12px}.help a{color:var(--red);font-weight:bold;font-size:22px;text-decoration:none;display:block}
.dose{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:14px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
#modal{position:fixed;inset:0;background:rgba(10,30,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
#modal.show{display:flex}.box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:560px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:99}
.note{font-size:12px;color:var(--mute);margin-top:8px}
@media(max-width:720px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;gap:6px;padding:12px;align-items:center;overflow-x:auto}aside h1{margin:0 10px 0 0;font-size:18px}aside button{width:auto;white-space:nowrap;margin:0}main{padding:16px}}
</style>
</head>
<body>
<aside>
  <h1>Care<span>Nest</span></h1>
  <button data-v="home" class="on">🏠 Home</button>
  <button data-v="doctors">👨‍⚕️ Find Doctors</button>
  <button data-v="appts">📅 Appointments</button>
  <button data-v="records">❤️ Health Records</button>
  <button data-v="meds">💊 Medicines</button>
  <button data-v="sos">🚑 Emergency</button>
</aside>
<main>
  <section id="home"></section>
  <section id="doctors" hidden>
    <h2>Find a doctor</h2><p class="sub">Search by name or speciality and book a slot.</p>
    <div class="bar"><input id="q" placeholder="Search doctor or speciality"><div id="cats" class="bar" style="margin:0"></div></div>
    <div class="grid" id="dlist"></div>
  </section>
  <section id="appts" hidden><h2>My Appointments</h2><p class="sub">Cancel any time before your visit.</p><div class="panel tbl" id="atable"></div></section>
  <section id="records" hidden></section>
  <section id="meds" hidden></section>
  <section id="sos" hidden></section>
</main>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const DOCS=[
{id:1,name:"Dr. Simran Kaur",sp:"General Physician",exp:12,fee:400,rate:4.7,icon:"👩‍⚕️"},
{id:2,name:"Dr. Rajesh Verma",sp:"Cardiologist",exp:18,fee:900,rate:4.8,icon:"👨‍⚕️"},
{id:3,name:"Dr. Anita Sharma",sp:"Gynecologist",exp:14,fee:700,rate:4.6,icon:"👩‍⚕️"},
{id:4,name:"Dr. Harpreet Singh",sp:"Orthopedic",exp:16,fee:800,rate:4.5,icon:"👨‍⚕️"},
{id:5,name:"Dr. Neha Gupta",sp:"Dermatologist",exp:9,fee:600,rate:4.7,icon:"👩‍⚕️"},
{id:6,name:"Dr. Amit Bansal",sp:"Pediatrician",exp:11,fee:500,rate:4.9,icon:"👨‍⚕️"},
{id:7,name:"Dr. Kavita Rao",sp:"Dentist",exp:8,fee:350,rate:4.4,icon:"👩‍⚕️"},
{id:8,name:"Dr. Sandeep Malhotra",sp:"ENT Specialist",exp:13,fee:650,rate:4.6,icon:"👨‍⚕️"}];
const SLOTS=["10:00 AM","10:30 AM","11:00 AM","11:30 AM","12:00 PM","02:00 PM","02:30 PM","03:00 PM","04:00 PM","05:00 PM"];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let appts=load("hc_appts",[]),vitals=load("hc_vitals",[]),meds=load("hc_meds",[]),taken=load("hc_taken",{}),prof=load("hc_prof",{});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
const iso=d=>d.toISOString().slice(0,10),addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)},today=()=>addDays(0);
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const docBy=id=>DOCS.find(d=>d.id===id);

function go(v){
  document.querySelectorAll("aside button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  ["home","doctors","appts","records","meds","sos"].forEach(id=>$("#"+id).hidden=id!==v);render();
}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>go(b.dataset.v));

let cat="All";
function renderDocs(){
  $("#cats").innerHTML=["All",...new Set(DOCS.map(d=>d.sp))].map(c=>`<span class="chip ${c===cat?"on":""}" data-c="${c}">${c}</span>`).join("");
  document.querySelectorAll("#cats .chip").forEach(x=>x.onclick=()=>{cat=x.dataset.c;renderDocs()});
  const q=$("#q").value.toLowerCase();
  const l=DOCS.filter(d=>(cat==="All"||d.sp===cat)&&(d.name+d.sp).toLowerCase().includes(q));
  $("#dlist").innerHTML=l.length?l.map(d=>`<div class="card"><div class="av">${d.icon}</div><h3>${d.name}</h3><p>${d.sp} - ${d.exp} yrs experience</p>
  <p>⭐ ${d.rate}</p><div class="row"><b>₹${d.fee}</b><button class="btn" onclick="openBook(${d.id})">Book visit</button></div></div>`).join(""):`<p>No doctor found. Try another name or speciality.</p>`;
}
$("#q").oninput=renderDocs;
let cur=null;
function busy(id,date){
  const s=new Set();SLOTS.forEach(t=>{if(hash(id+date+t)%100<30)s.add(t)});
  appts.filter(a=>a.doc===id&&a.date===date&&a.status==="Booked").forEach(a=>s.add(a.time));return s;
}
function openBook(id){cur={id,date:addDays(1),time:"",name:prof.name||"",age:prof.age||"",reason:""};draw();$("#modal").classList.add("show")}
const closeModal=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function draw(){
  const d=docBy(cur.id),b=busy(cur.id,cur.date);
  $("#box").innerHTML=`<div class="row"><h2 style="font-size:20px;margin:0">${d.icon} ${d.name}</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <p class="sub" style="margin:4px 0 12px">${d.sp} - fee ₹${d.fee}</p>
  <label>Appointment date</label><input type="date" id="dt" value="${cur.date}" min="${today()}" max="${addDays(60)}">
  <label style="margin-top:12px">Available time slots</label>
  <div class="slots">${SLOTS.map(t=>`<span class="chip ${t===cur.time?"on":""} ${b.has(t)?"dis":""}" data-t="${t}">${t}</span>`).join("")}</div>
  <div class="form"><div class="fld"><label>Patient name</label><input id="nm" value="${esc(cur.name)}"></div>
  <div class="fld"><label>Age</label><input id="ag" type="number" min="0" max="120" value="${cur.age}"></div></div>
  <label style="margin-top:12px">Reason for visit</label><textarea id="rs" rows="2" style="width:100%">${esc(cur.reason)}</textarea>
  <div class="row" style="margin-top:14px"><b>${cur.time?cur.time+", "+cur.date:"Pick a time slot"}</b><button class="btn" id="cf">Confirm appointment</button></div>`;
  const keep=()=>{cur.name=$("#nm").value;cur.age=$("#ag").value;cur.reason=$("#rs").value};
  $("#dt").onchange=e=>{keep();if(e.target.value<today())return toast("Pick today or a future date");cur.date=e.target.value;cur.time="";draw()};
  document.querySelectorAll(".slots .chip:not(.dis)").forEach(c=>c.onclick=()=>{keep();cur.time=c.dataset.t;draw()});
  $("#cf").onclick=()=>{keep();
    if(!cur.time)return toast("Please select a time slot");
    if(!cur.name.trim())return toast("Please enter patient name");
    if(!(+cur.age>0))return toast("Please enter a valid age");
    if(busy(cur.id,cur.date).has(cur.time))return toast("Slot just got booked. Pick another.");
    appts.unshift({id:"AP"+Date.now().toString().slice(-6),doc:cur.id,date:cur.date,time:cur.time,name:cur.name.trim(),age:cur.age,reason:cur.reason.trim(),fee:d.fee,status:"Booked"});
    put("hc_appts",appts);closeModal();toast("Appointment booked!");render()};
}

function cancelAppt(id){const a=appts.find(x=>x.id===id);if(!a||!confirm("Cancel appointment with "+docBy(a.doc).name+"?"))return;a.status="Cancelled";put("hc_appts",appts);toast("Appointment cancelled. Slot released.");render()}
function renderAppts(){
  $("#atable").innerHTML=appts.length?`<table><tr><th>ID</th><th>Doctor</th><th>Patient</th><th>Date & time</th><th>Fee</th><th>Status</th><th></th></tr>`+appts.map(a=>{const d=docBy(a.doc);
  return `<tr><td>${a.id}</td><td>${d.name}<br><small class="note">${d.sp}</small></td><td>${esc(a.name)}, ${a.age}<br><small class="note">${esc(a.reason)||"General checkup"}</small></td><td>${a.date}<br>${a.time}</td><td>₹${a.fee}</td>
  <td><span class="tag ${a.status}">${a.status}</span></td><td>${a.status==="Booked"?`<button class="btn ghost sm" onclick="cancelAppt('${a.id}')">Cancel</button>`:""}</td></tr>`}).join("")+`</table>`
  :`<p>No appointments yet. Open Find Doctors to book your first visit.</p>`;
}

const bmiCat=b=>b<18.5?["Underweight","Watch"]:b<25?["Normal","Normal"]:b<30?["Overweight","Watch"]:["Obese","High"];
const bpCat=(s,d)=>s>=140||d>=90?["High","High"]:s<90||d<60?["Low","Low"]:["Normal","Normal"];
const sugCat=v=>v<100?["Normal","Normal"]:v<126?["Watch","Watch"]:["High","High"];
function renderRecords(){
  const last=vitals[0];
  $("#records").innerHTML=`<h2>Health records</h2><p class="sub">Save your vitals and track them over time.</p>
  <div class="panel"><b>Patient profile</b><div class="form" style="margin-top:10px">
  <div class="fld"><label>Name</label><input id="pn" value="${esc(prof.name||"")}"></div>
  <div class="fld"><label>Age</label><input id="pa" type="number" value="${prof.age||""}"></div>
  <div class="fld"><label>Blood group</label><select id="pb">${["","A+","A-","B+","B-","O+","O-","AB+","AB-"].map(x=>`<option ${prof.bg===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="fld"><label>Allergies</label><input id="pl" value="${esc(prof.allergy||"")}" placeholder="e.g. Penicillin"></div>
  <button class="btn" onclick="saveProf()">Save profile</button></div></div>
  <div class="panel"><b>Add today's vitals</b><div class="form" style="margin-top:10px">
  <div class="fld"><label>BP upper (systolic)</label><input id="vs" type="number"></div><div class="fld"><label>BP lower (diastolic)</label><input id="vd" type="number"></div>
  <div class="fld"><label>Sugar (mg/dL, fasting)</label><input id="vg" type="number"></div><div class="fld"><label>Pulse (bpm)</label><input id="vp" type="number"></div>
  <div class="fld"><label>Weight (kg)</label><input id="vw" type="number" step="0.1" value="${last?last.w:""}"></div><div class="fld"><label>Height (cm)</label><input id="vh" type="number" value="${last?last.h:""}"></div>
  <button class="btn" onclick="addVitals()">Save vitals</button></div>
  <p class="note">This is for tracking only and is not medical advice. Please consult a doctor for any concern.</p></div>
  <div class="panel tbl"><b>History</b>${vitals.length?`<table><tr><th>Date</th><th>BP</th><th>Sugar</th><th>Pulse</th><th>BMI</th><th></th></tr>`+vitals.map((v,i)=>`<tr><td>${v.date}</td>
  <td>${v.s}/${v.d} <span class="tag ${bpCat(v.s,v.d)[1]}">${bpCat(v.s,v.d)[0]}</span></td><td>${v.g} <span class="tag ${sugCat(v.g)[1]}">${sugCat(v.g)[0]}</span></td><td>${v.p}</td>
  <td>${v.bmi} <span class="tag ${bmiCat(v.bmi)[1]}">${bmiCat(v.bmi)[0]}</span></td><td><button class="btn ghost sm" onclick="delVital(${i})">Delete</button></td></tr>`).join("")+`</table>`:`<p class="note" style="margin-top:8px">No records yet. Add your first reading above.</p>`}</div>`;
}
function saveProf(){prof={name:$("#pn").value.trim(),age:$("#pa").value,bg:$("#pb").value,allergy:$("#pl").value.trim(),ec:prof.ec||{}};put("hc_prof",prof);toast("Profile saved");render()}
function addVitals(){
  const n=id=>+$("#"+id).value,v={date:today(),s:n("vs"),d:n("vd"),g:n("vg"),p:n("vp"),w:n("vw"),h:n("vh")};
  if(!(v.s>0&&v.d>0&&v.g>0&&v.p>0&&v.w>0&&v.h>0))return toast("Please fill all vitals with valid numbers");
  if(v.d>=v.s)return toast("Upper BP must be higher than lower BP");
  v.bmi=+(v.w/Math.pow(v.h/100,2)).toFixed(1);vitals.unshift(v);put("hc_vitals",vitals);toast("Vitals saved");render();
}
function delVital(i){if(confirm("Delete this record?")){vitals.splice(i,1);put("hc_vitals",vitals);render()}}

const TM=["Morning","Afternoon","Night"];
function renderMeds(){
  const t=today();
  $("#meds").innerHTML=`<h2>Medicine reminders</h2><p class="sub">Add your medicines and tick each dose as you take it.</p>
  <div class="panel"><div class="form"><div class="fld"><label>Medicine name</label><input id="mn" placeholder="e.g. Metformin"></div>
  <div class="fld"><label>Dose</label><input id="md" placeholder="e.g. 500 mg"></div>
  <div class="fld"><label>Take when</label><div>${TM.map(x=>`<label class="dose"><input type="checkbox" class="mt" value="${x}"> ${x}</label>`).join("")}</div></div>
  <button class="btn" onclick="addMed()">Add medicine</button></div></div>
  <div class="panel"><b>Today's doses (${t})</b>${meds.length?`<table>`+meds.map((m,i)=>`<tr><td><b>${esc(m.name)}</b><br><small class="note">${esc(m.dose)}</small></td>
  <td>${m.times.map(x=>{const k=t+"|"+m.id+"|"+x;return `<label class="dose"><input type="checkbox" ${taken[k]?"checked":""} onchange="tick('${k}',this.checked)"> ${x}</label>`}).join("")}</td>
  <td><button class="btn ghost sm" onclick="delMed(${i})">Remove</button></td></tr>`).join("")+`</table>`:`<p class="note" style="margin-top:8px">No medicines added. Add one above.</p>`}</div>`;
}
function addMed(){
  const name=$("#mn").value.trim(),times=[...document.querySelectorAll(".mt:checked")].map(x=>x.value);
  if(!name)return toast("Enter the medicine name");if(!times.length)return toast("Choose at least one time of day");
  meds.push({id:Date.now(),name,dose:$("#md").value.trim(),times});put("hc_meds",meds);toast("Medicine added");render();
}
function tick(k,c){if(c)taken[k]=1;else delete taken[k];put("hc_taken",taken);renderHome()}
function delMed(i){if(confirm("Remove this medicine?")){meds.splice(i,1);put("hc_meds",meds);toast("Medicine removed");render()}}

function renderSos(){
  const ec=prof.ec||{};
  $("#sos").innerHTML=`<h2>Emergency</h2><p class="sub">In a life-threatening situation, call at once.</p>
  <div class="sos"><b>National emergency number</b><br><a href="tel:112">📞 112</a></div>
  <div class="help"><div>Ambulance<a href="tel:108">108</a></div><div>Ambulance (patient transport)<a href="tel:102">102</a></div><div>Health helpline<a href="tel:104">104</a></div></div>
  <div class="panel"><b>My emergency contact</b><div class="form" style="margin-top:10px">
  <div class="fld"><label>Contact name</label><input id="en" value="${esc(ec.name||"")}"></div>
  <div class="fld"><label>Phone number</label><input id="ep" type="tel" value="${esc(ec.phone||"")}"></div>
  <button class="btn" onclick="saveEc()">Save contact</button>${ec.phone?`<a class="btn red" style="text-decoration:none;text-align:center" href="tel:${esc(ec.phone)}">Call ${esc(ec.name||"contact")}</a>`:""}</div>
  <p class="note">Blood group: <b>${prof.bg||"not set"}</b> - Allergies: <b>${esc(prof.allergy||"not set")}</b> (edit in Health Records)</p></div>`;
}
function saveEc(){const p=$("#ep").value.trim();if(!/^[0-9+\- ]{7,15}$/.test(p))return toast("Enter a valid phone number");prof.ec={name:$("#en").value.trim(),phone:p};put("hc_prof",prof);toast("Emergency contact saved");render()}

function renderHome(){
  const t=today(),up=appts.filter(a=>a.status==="Booked"&&a.date>=t).sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1);
  const total=meds.reduce((n,m)=>n+m.times.length,0),done=meds.reduce((n,m)=>n+m.times.filter(x=>taken[t+"|"+m.id+"|"+x]).length,0),v=vitals[0];
  $("#home").innerHTML=`<h2>${prof.name?"Hello, "+esc(prof.name):"Welcome to CareNest"} 👋</h2><p class="sub">Your health, appointments and medicines in one place.</p>
  <div class="tiles">${[["doctors","👨‍⚕️","Find doctors"],["appts","📅","Appointments"],["records","❤️","Health records"],["meds","💊","Medicines"],["sos","🚑","Emergency"]].map(([k,i,n])=>`<div class="tile" onclick="go('${k}')"><span>${i}</span>${n}</div>`).join("")}</div>
  <div class="stats"><div class="stat"><span>Upcoming visits</span><b>${up.length}</b></div>
  <div class="stat"><span>Doses taken today</span><b>${total?done+" / "+total:"-"}</b></div>
  <div class="stat"><span>Latest BP</span><b>${v?v.s+"/"+v.d:"-"}</b></div>
  <div class="stat"><span>Latest BMI</span><b>${v?v.bmi:"-"}</b></div></div>
  <div class="panel tbl"><b>Next appointments</b>${up.length?`<table>`+up.slice(0,4).map(a=>`<tr><td>${docBy(a.doc).name}<br><small class="note">${docBy(a.doc).sp}</small></td><td>${a.date}<br>${a.time}</td><td>${esc(a.name)}</td>
  <td><button class="btn ghost sm" onclick="cancelAppt('${a.id}')">Cancel</button></td></tr>`).join("")+`</table>`:`<p class="note" style="margin-top:8px">No upcoming visits. Book one from Find Doctors.</p>`}</div>`;
}
